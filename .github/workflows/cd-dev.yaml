name: CD (dev)

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  packages: write       # push images to GHCR
  pull-requests: write   # comment image reference on PRs

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/yk-update-checker

jobs:
  build-dev:
    name: Build & push dev image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture build date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      # ── Master branch: :dev + :sha-<short> ──────────────────────
      - name: Build and push (master)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            VERSION=dev-${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── PR branch: :pr-<number>-<short_sha> ─────────────────────
      - name: Build and push (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          build-args: |
            VERSION=pr-${{ github.event.pull_request.number }}-${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Comment image reference on PR
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: dev-image
          message: |
            ## Dev image for this PR

            ```bash
            docker pull ${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }}-${{ github.sha }}
            ```
