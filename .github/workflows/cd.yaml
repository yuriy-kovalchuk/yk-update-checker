name: CD

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write          # create GitHub Releases and upload assets
  packages: write          # push images and charts to GHCR
  security-events: write   # upload Trivy SARIF results

env:
  REGISTRY:   ghcr.io
  IMAGE:      ghcr.io/${{ github.repository_owner }}/yk-update-checker
  CHART_NAME: yk-update-checker
  CHART_DIR:  charts/yk-update-checker

jobs:
  # ── Derive version once, share across jobs ─────────────────────────────────
  version:
    name: Extract version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag:     ${{ steps.version.outputs.tag }}
      date:    ${{ steps.date.outputs.date }}
    steps:
      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Capture build date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  # ── Build and push image ───────────────────────────────────────────────────
  build-image:
    name: Build & push image
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ needs.version.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Security: Trivy image scan ────────────────────────────────────────────
  scan-image:
    name: Trivy image scan
    needs: [version, build-image]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy image scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN
          limit-severities-for-sarif: true

      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ── Package Helm chart and create GitHub Release ───────────────────────────
  release:
    name: Package chart & release
    needs: [version, build-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # Same Helm as the local chart checks.
          version: v3.12.3

      - name: Log in to Helm OCI registry (GHCR)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ${{ env.REGISTRY }} \
              --username ${{ github.actor }} \
              --password-stdin

      - name: Verify chart version matches the tag
        # The chart ships as Chart.yaml declares; a forgotten version bump fails the release instead of shipping an unbuilt image tag.
        run: |
          version="${{ needs.version.outputs.version }}"
          chart_version=$(helm show chart "$CHART_DIR" | awk '/^version:/ {print $2}' | tr -d '"')
          app_version=$(helm show chart "$CHART_DIR" | awk '/^appVersion:/ {print $2}' | tr -d '"')
          if [ "$chart_version" != "$version" ] || [ "$app_version" != "$version" ]; then
            echo "::error::Chart.yaml is out of sync with tag ${GITHUB_REF_NAME}: version=${chart_version} appVersion=${app_version}, want ${version}. Bump both in a release-prep commit (see README 'Releasing')."
            exit 1
          fi
          echo "Chart.yaml matches ${GITHUB_REF_NAME} (version=${chart_version}, appVersion=${app_version})"

      - name: Package Helm chart
        id: helm-package
        run: |
          helm package "$CHART_DIR" --destination .
          echo "tgz=${CHART_NAME}-${{ needs.version.outputs.version }}.tgz" >> "$GITHUB_OUTPUT"

      - name: Push Helm chart to GHCR
        run: |
          helm push ${{ steps.helm-package.outputs.tgz }} \
            oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.helm-package.outputs.tgz }}
          body: |
            ## Docker image

            ```bash
            docker pull ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
            ```

            ## Helm chart

            ```bash
            helm install yk-update-checker \
              oci://ghcr.io/${{ github.repository_owner }}/charts/yk-update-checker \
              --version ${{ needs.version.outputs.version }} \
              -f values.yaml
            ```
