{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "yk-update-checker.serviceAccountName" . }}
  labels:
    {{- include "yk-update-checker.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "yk-update-checker.scannerServiceAccountName" . }}
  labels:
    {{- include "yk-update-checker.labels" . | nindent 4 }}
    app.kubernetes.io/component: scanner
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
