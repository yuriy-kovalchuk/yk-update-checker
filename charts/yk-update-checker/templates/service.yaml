apiVersion: v1
kind: Service
metadata:
  name: {{ include "yk-update-checker.fullname" . }}
  labels:
    {{- include "yk-update-checker.labels" . | nindent 4 }}
    # ServiceMonitor selects on Service labels, not spec.selector.
    app.kubernetes.io/component: dashboard
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "yk-update-checker.selectorLabels" . | nindent 4 }}
    # Scanner pods share the selector labels; this keeps the Service off them.
    app.kubernetes.io/component: dashboard
