{{- /* CRDs generated by `make generate` into files/crds; templated so upgrades apply them, kept on uninstall so the reports survive. */}}
{{- if .Values.crds.install }}
{{- range $path, $_ := .Files.Glob "files/crds/*.yaml" }}
{{- $crd := $.Files.Get $path | fromYaml }}
{{- $_ := set $crd.metadata "annotations" (merge (dict "helm.sh/resource-policy" "keep") ($crd.metadata.annotations | default dict)) }}
{{- $_ := set $crd.metadata "labels" (include "yk-update-checker.labels" $ | fromYaml) }}
---
{{ toYaml $crd }}
{{- end }}
{{- end }}
