{{- /* The dashboard only reads the reports and starts scans, so it mounts nothing and can run more than one replica. */ -}}
{{- $args := list "dashboard" "--mode=kubernetes" "--port=8080"
      (printf "--cronjob=%s" (include "yk-update-checker.scannerName" .))
      (printf "--lease=%s" (include "yk-update-checker.leaseName" .)) -}}
{{- $extra := `ports:
  - name: http
    containerPort: 8080
    protocol: TCP
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 30
readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10` -}}
{{- $container := dict "root" . "name" "update-checker" "args" $args "scans" false
      "extraEnv" .Values.extraEnv "security" .Values.containerSecurityContext
      "resources" .Values.resources "extra" $extra -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yk-update-checker.fullname" . }}
  labels:
    {{- include "yk-update-checker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "yk-update-checker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "yk-update-checker.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: {{ include "yk-update-checker.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        {{- include "yk-update-checker.container" $container | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
