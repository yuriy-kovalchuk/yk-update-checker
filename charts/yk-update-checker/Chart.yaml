apiVersion: v2
name: yk-update-checker
description: Scans GitOps repositories for outdated Helm chart dependencies, FluxCD HelmReleases and pinned container images, and serves a web dashboard.
type: application
# Versioning policy (enforced by .github/workflows/cd.yaml on tag push):
#   appVersion — the update-checker release this chart's defaults target; always equals the
#                release tag without the "v" (deployment.yaml falls back to it for image.tag).
#   version    — the chart's own semver. Kept in lockstep with appVersion; a chart-only fix
#                (no image change) may bump version on its own.
# Between releases these hold the last released values. A release-prep commit bumps both to the
# new version and converts CHANGELOG.md [Unreleased] into a dated section; pushing the tag then
# publishes what is in this file, and CI fails the release if they do not match the tag.
version: 0.4.1
appVersion: "0.4.1"
keywords:
  - helm
  - fluxcd
  - update-checker
  - gitops
  - homelab
home: https://github.com/yuriy-kovalchuk/yk-update-checker
sources:
  - https://github.com/yuriy-kovalchuk/yk-update-checker
maintainers:
  - name: yuriy kovalchuk
    email: yuriykovalchuk1992@icloud.com
icon: https://raw.githubusercontent.com/yuriy-kovalchuk/yk-update-checker/master/internal/dashboard/ui/favicon.svg
