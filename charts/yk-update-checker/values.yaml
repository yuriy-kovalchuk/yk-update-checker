# Default values for yk-update-checker. Install one release per namespace: reports are namespaced by repository name, not by release.

# Override the chart-derived object names (read by _helpers.tpl).
nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/yuriy-kovalchuk/yk-update-checker
  tag: ""          # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# Pull secrets for the checker's own image, e.g. `kubectl create secret docker-registry harbor-pull --docker-server=… -n <namespace>`.
imagePullSecrets: []
# - name: harbor-pull

# ── Dashboard: results live in RepositoryScan/Dependency resources, so replicas are fine; only the leader exports metrics ──
replicaCount: 1

service:
  # No NetworkPolicy ships with the chart: bound access yourself (docs/architecture.md, "Trust model & exposure").
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: update-checker.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi

# Security context for the dashboard Deployment. Overridden independently from scanner.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

# Extra environment variables applied to the dashboard Deployment.
extraEnv: []
# - name: FOO
#   value: bar

# ── Scanner CronJob ───────────────────────────────────────────────────────────
scanner:
  # Cron schedule, in UTC (the pod sets no TZ).
  schedule: "0 0 * * *"
  # Suspend the CronJob without deleting it.
  suspend: false

  # Backstop for a wedged scan Job (seconds); keep it above scanner.config.scan_timeout. Manual Jobs inherit it.
  activeDeadlineSeconds: 2400
  # A run that cannot start within this many seconds is recorded as missed instead of skipped silently.
  startingDeadlineSeconds: 600

  # Scan runs kept in each RepositoryScan's status.history (newest first); nothing keeps a copy of every run's items.
  history:
    runs: 10

  # Extra env for the scan pod only (the Deployment uses top-level extraEnv).
  extraEnv: []
  # - name: HTTPS_PROXY
  #   value: http://proxy.internal:3128

  # Scanner config — serialised as config.yaml mounted into the CronJob pod.
  config:
    update_type: all          # all | minor | patch  ("major" is accepted and behaves as all)
    scan_timeout: 30m         # whole-scan budget; "0" = unbounded (discouraged, see the CronJob deadlines)
    parallel_checks: 5        # registry lookups per repository; two repositories are scanned at a time
    check_images: true        # container images referenced by workloads
    check_dockerfiles: true   # base images in Dockerfile/Containerfile FROM lines
    # Reject stray tags (backports, fork rebuilds) before offering them; false reports the highest tag as listed.
    verify_image_tags: true
    repos: []
    # - name: my-gitops
    #   repo: https://github.com/example/my-gitops-repo
    #   path: kubernetes/apps   # optional sub-path
    #   auth:
    #     type: token                              # token | basic | ssh
    #     existingSecret: homelab-github-token     # a Secret you created; the chart
    #     existingSecretKey: token                 # mounts it read-only for this repo
    # Credentials come only from Secrets you create (auth.existingSecret, mounted read-only into the scan pod); see examples/credentials.values.yaml.

  # A kubernetes.io/dockerconfigjson Secret for private registries (only its "auths" are read); Harbor's API gets the same account for push dates.
  registryAuth:
    existingSecret: ""
    existingSecretKey: .dockerconfigjson

  # SSH host key verification, for repos with auth.type: ssh.
  ssh:
    # true: an ssh repo needs its host keys in knownHosts or the chart refuses to render; false accepts any host key.
    strictHostKeyChecking: true
    # known_hosts content, e.g. from `ssh-keyscan -t ed25519,rsa github.com`; set as auth.known_hosts_file for every ssh repo.
    knownHosts: ""
    # github.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOMqqnkV6rm4KOFGObNWcPH5GLu...

  # The Go heap gets 70% of the memory limit, the rest is for git; 512Mi fits one 20 MB Helm index decode.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  # Security context for the scanner CronJob — independent from deployment.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

# ── RBAC (needed by both halves) ──────────────────────────────────────────────
rbac:
  # Two Roles: the dashboard's (scan Jobs, report reads, leader Lease) and the scanner's (only the two update-checker resources, because that pod clones hostile content).
  create: true

serviceAccount:
  create: true
  name: ""
  scannerName: ""   # with create=false: the existing ServiceAccount the scan CronJob runs as
  annotations: {}

# ── Prometheus / Alertmanager integration ──────────────────────────────────────
grafana:
  # A ConfigMap with the Grafana dashboard, labelled grafana_dashboard: "1" for sidecar discovery.
  dashboard:
    enabled: false
    # k8s-sidecar-target-directory folder, relative to sidecarBaseDir (the sidecar's watched directory).
    folder: "Security"
    sidecarBaseDir: "/tmp/dashboards"
    additionalLabels: {}

metrics:
  # Exported by the leader dashboard replica; metric names, labels and alerting advice are in docs/architecture.md.

  # ServiceMonitor CRD — requires Prometheus Operator.
  serviceMonitor:
    enabled: false
    additionalLabels: {}
    interval: "1m"

  # PrometheusRule CRD — generates alert rules routed to Alertmanager.
  prometheusRule:
    enabled: false
    # One rule per scope (matched on the metric label); "unknown" bumps cannot be classified, so they warn.
    rules:
      - scope: major
        severity: warning
      - scope: minor
        severity: info
      - scope: patch
        severity: info
      - scope: unknown
        severity: warning

    # Fires when the newest successful repository scan is older than thresholdSeconds; keep it above the schedule interval.
    staleScan:
      enabled: true
      thresholdSeconds: 108000
    # Fires while a repository's latest scan failed; its previous results stay visible, this rule says they are stale.
    scanFailed:
      enabled: true
      severity: warning
      for: 10m
    # Fires when an image digest moved since the previous scan; keep `for` well below the schedule interval.
    digestDrift:
      enabled: true
      severity: warning
      for: 1m

