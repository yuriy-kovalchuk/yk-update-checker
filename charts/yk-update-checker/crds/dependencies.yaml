# One Dependency per checked reference, named after its identity, so a rescan updates it instead of appending a copy.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dependencies.updatechecker.yuriykovalchuk.dev
spec:
  group: updatechecker.yuriykovalchuk.dev
  scope: Namespaced
  names:
    kind: Dependency
    listKind: DependencyList
    plural: dependencies
    singular: dependency
    shortNames:
      - dep
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .status.type
        - name: Dependency
          type: string
          jsonPath: .status.dependency
        - name: Current
          type: string
          jsonPath: .status.current_version
        - name: Latest
          type: string
          jsonPath: .status.latest_version
        - name: Scope
          type: string
          jsonPath: .status.scope
        - name: Outdated Since
          type: date
          jsonPath: .status.outdated_since
      schema:
        openAPIV3Schema:
          type: object
          properties:
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
