# One RepositoryScan per scanned repository: its latest run, its history, and no copies of the references it found.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: repositoryscans.updatechecker.yuriykovalchuk.dev
spec:
  group: updatechecker.yuriykovalchuk.dev
  scope: Namespaced
  names:
    kind: RepositoryScan
    listKind: RepositoryScanList
    plural: repositoryscans
    singular: repositoryscan
    shortNames:
      - repscan
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Outdated
          type: integer
          jsonPath: .status.counts.outdated
        - name: Failed
          type: integer
          jsonPath: .status.counts.failed
        - name: Last Scan
          type: date
          jsonPath: .status.last_scan_time
      schema:
        openAPIV3Schema:
          type: object
          properties:
            status: # written whole by the scanner, so nothing here is pruned
              type: object
              x-kubernetes-preserve-unknown-fields: true
