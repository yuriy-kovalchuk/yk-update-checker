# Credential Secrets for private repos: fill in, `kubectl apply -n <chart namespace>`, then reference each from auth.existingSecret (examples/credentials.values.yaml).

apiVersion: v1
kind: Secret
metadata:
  name: homelab-github-token
type: Opaque
stringData:
  # read by auth.type: token (default key name: "token")
  token: ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
---
apiVersion: v1
kind: Secret
metadata:
  name: gitea-basic-auth
type: Opaque
stringData:
  # auth.type: basic (default key "password"); the username stays inline as auth.username.
  password: change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: deploy-key-repo-ssh
type: Opaque
stringData:
  # auth.type: ssh (default key "id_ed25519"; `--from-file=ssh-privatekey` Secrets need existingSecretKey: ssh-privatekey).
  ssh-privatekey: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    ...
    -----END OPENSSH PRIVATE KEY-----
