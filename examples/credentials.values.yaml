# Overlay for private repos backed by Secrets you created (examples/private-repo-secrets.yaml); token/basic need https, ssh needs scanner.ssh.knownHosts.

scanner:
  ssh:
    strictHostKeyChecking: true
    knownHosts: |
      # replace with: ssh-keyscan -t ed25519,rsa github.com
      github.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOMqqnkV6rm4KOFGObNWcPH5GLuPQ8V8gNwP0bN7p0VX
  config:
    repos:
      # HTTPS with a token, sent as `Authorization: Basic base64(git:<token>)`.
      - name: homelab
        repo: https://github.com/example/homelab.git
        path: kubernetes/apps
        auth:
          type: token
          existingSecret: homelab-github-token

      # HTTPS basic auth. The username is configuration, the password is a Secret.
      - name: gitea-apps
        repo: https://gitea.example.com/infra/apps.git
        auth:
          type: basic
          username: ci-readonly
          existingSecret: gitea-basic-auth

      # SSH deploy key. Key name is not the default, so it is stated.
      - name: deploy-key-repo
        repo: git@github.com:example/private.git
        auth:
          type: ssh
          existingSecret: deploy-key-repo-ssh
          existingSecretKey: ssh-privatekey
