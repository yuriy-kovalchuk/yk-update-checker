# Scanner config for running the binary directly; with Helm it is generated from values.yaml.

# Upgrade scope reported: all (default), minor, patch; "major" behaves exactly like all.
update_type: all

# Registry lookups per repository; two repositories are scanned at a time, so at most 2 × this run at once.
parallel_checks: 5

# Budget for one scan (default 30m, "0" = none); keep the CronJob's activeDeadlineSeconds above it.
# scan_timeout: 30m

# What gets scanned: workload images and Dockerfile FROM lines (both default true).
# check_images: true
# check_dockerfiles: true

# Reject stray candidate tags (backports, fork rebuilds) before reporting (default true).
# verify_image_tags: true

# Docker config file with registry credentials; only "auths" is read. With Helm use scanner.registryAuth.existingSecret.
# registry_auth_file: /etc/update-checker-scanner/registry/config.json

# Keep clones between scans; only useful with a persistent volume at this path.
# git_cache_dir: /cache/git

repos:
  # Public repository — no auth required
  - name: homelab
    repo: https://github.com/example/my-gitops-repo
    path: kubernetes/apps   # optional: scan only this sub-path
    # Load rejects credentials in the URL, and token/basic auth over anything but https.

  # Private repository, HTTPS token from a file you mount (with Helm: auth.existingSecret).
  - name: private-repo
    repo: https://github.com/example/private-repo
    auth:
      type: token
      token_file: /etc/update-checker-scanner/secrets/private-repo/token

  # Private repository — HTTPS basic auth
  - name: gitea-private
    repo: https://gitea.example.com/org/repo
    auth:
      type: basic
      username: myuser
      password_file: /etc/update-checker-scanner/secrets/gitea-private/password

  # Private repository, SSH key (0440 read-only is fine: ssh only checks keys it owns).
  - name: ssh-repo
    repo: git@github.com:example/private-repo.git
    auth:
      type: ssh
      ssh_key_path: /etc/update-checker-scanner/secrets/ssh-repo/id_ed25519
      # Verify host keys (e.g. `ssh-keyscan -t ed25519,rsa github.com`); without it every scan trusts any key.
      known_hosts_file: /etc/update-checker/known_hosts
