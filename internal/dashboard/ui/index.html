<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Update Checker</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>

<div class="head">
  <header class="app-bar">
    <img class="brand-icon" src="/favicon.svg" width="24" height="24" alt="">
    <div class="brand">
      <span class="brand-title">Update Checker</span>
      <span class="brand-sub" id="version-text">v?</span>
    </div>
    <span class="spacer"></span>
    <span class="pill" id="status-chip" title="scanner state">
      <span class="nf" id="status-icon" aria-hidden="true">&#xf111;</span>
      <span id="status-text">connecting</span>
    </span>
    <span class="pill" id="last-scan" title="last completed scan">
      <span class="nf" aria-hidden="true">&#xf017;</span>
      <span id="last-scan-text">never</span>
    </span>
    <button class="btn filled hidden" id="scan-btn" type="button" title="trigger a scan now (keyboard: r)">
      <span class="nf" aria-hidden="true">&#xf021;</span>
      <span>Scan now</span>
    </button>
  </header>

  <nav class="filters" aria-label="filters">
    <label class="field">
      <span class="nf" aria-hidden="true">&#xf002;</span>
      <input id="q" type="text" placeholder="filter by name, workload or file (/)" autocomplete="off" spellcheck="false">
    </label>

    <select class="select" id="f-repo" aria-label="repository" title="show only one scanned repository">
      <option value="">all repositories</option>
    </select>

    <span class="segmented" id="f-cat" role="group" aria-label="category">
      <button class="seg" type="button" data-v="" aria-pressed="true">All</button>
      <button class="seg" type="button" data-v="image" aria-pressed="false"><img class="logo" src="/assets/logos/kubernetes.svg" alt="" aria-hidden="true">Images</button>
      <button class="seg" type="button" data-v="dockerfile" aria-pressed="false"><img class="logo" src="/assets/logos/docker.svg" alt="" aria-hidden="true">Dockerfiles</button>
      <button class="seg" type="button" data-v="helm" aria-pressed="false"><img class="logo" src="/assets/logos/helm.svg" alt="" aria-hidden="true">Helm</button>
      <button class="seg" type="button" data-v="fluxcd" aria-pressed="false"><img class="logo" src="/assets/logos/flux.svg" alt="" aria-hidden="true">FluxCD</button>
    </span>

    <span class="segmented" id="f-view" role="group" aria-label="layout">
      <button class="seg" type="button" data-v="attention" aria-pressed="true" title="what needs action first, everything current folded below">Attention</button>
      <button class="seg" type="button" data-v="category" aria-pressed="false" title="grouped by images, Dockerfiles, Helm and FluxCD">Category</button>
    </span>

    <select class="select" id="f-scope" aria-label="update scope">
      <option value="">any scope</option>
      <option value="major">major</option>
      <option value="minor">minor</option>
      <option value="patch">patch</option>
      <option value="unknown">unknown</option>
    </select>

    <span class="filter-count" id="shown-count" aria-live="polite"></span>
  </nav>
</div>

<section class="stats" id="stats" aria-label="scan summary; each tile filters the list">
  <button class="stat" type="button" data-tile="" aria-pressed="false" title="all checks, clears the tile filter">
    <span class="nf" aria-hidden="true">&#xf03a;</span>
    <span class="stat-body"><span class="stat-n" id="s-total">0</span><span class="stat-l">checked</span></span>
  </button>
  <button class="stat is-update" type="button" data-tile="updates" aria-pressed="false" title="checks with a newer version">
    <span class="nf" aria-hidden="true">&#xf178;</span>
    <span class="stat-body"><span class="stat-n" id="s-updates">0</span><span class="stat-l">updates</span></span>
  </button>
  <button class="stat is-major" type="button" data-tile="major" aria-pressed="false" title="major version updates">
    <span class="nf" aria-hidden="true">&#xf062;</span>
    <span class="stat-body"><span class="stat-n" id="s-major">0</span><span class="stat-l">major</span></span>
  </button>
  <button class="stat is-skipped" type="button" data-tile="skipped" aria-pressed="false" title="stray tags rejected by verification">
    <span class="nf" aria-hidden="true">&#xf05e;</span>
    <span class="stat-body"><span class="stat-n" id="s-skipped">0</span><span class="stat-l">skipped</span></span>
  </button>
  <button class="stat is-err" type="button" data-tile="errors" aria-pressed="false" title="lookups that failed">
    <span class="nf" aria-hidden="true">&#xf071;</span>
    <span class="stat-body"><span class="stat-n" id="s-errors">0</span><span class="stat-l">errors</span></span>
  </button>
  <button class="stat is-drift" type="button" data-tile="drift" aria-pressed="false" title="digest moved since the previous scan">
    <span class="nf" aria-hidden="true">&#xf1b8;</span>
    <span class="stat-body"><span class="stat-n" id="s-drift">0</span><span class="stat-l">drift</span></span>
  </button>
  <button class="stat is-ok" type="button" data-tile="current" aria-pressed="false" title="nothing to do">
    <span class="nf" aria-hidden="true">&#xf00c;</span>
    <span class="stat-body"><span class="stat-n" id="s-ok">0</span><span class="stat-l">current</span></span>
  </button>
</section>

<div class="banner hidden" id="scan-error">
  <span class="nf" aria-hidden="true">&#xf071;</span>
  <span id="scan-error-text"></span>
</div>

<main id="groups"></main>

<footer class="page-foot">
  <span><span class="nf" aria-hidden="true">&#xf017;</span>checked <span id="foot-checked">—</span></span>
  <span><span class="nf" aria-hidden="true">&#xf021;</span>auto-refresh <span id="foot-refresh">—</span></span>
  <span><span class="nf" aria-hidden="true">&#xf121;</span>update-checker <span id="foot-version">—</span></span>
</footer>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/assets/app.js"></script>
</body>
</html>
