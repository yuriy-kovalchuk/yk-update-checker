<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Update Checker</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- Not deferred: it sets data-theme before the stylesheet paints, so a dark choice never flashes white. -->
<script src="/assets/theme.js"></script>
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/app.js" defer></script>
</head>
<body>

<header class="topbar">
  <span class="brand">
    <svg class="brand-mark" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path class="mark-arrow" d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
      <path class="mark-arrow" d="M21 3v5h-5"/>
      <path class="mark-check" d="M8.2 12.4l2.9 2.9 5.2-5.8"/>
    </svg>
    <span>Update Checker</span>
    <span class="version-chip" id="version-text">v?</span>
  </span>
  <div class="topbar-right">
    <!-- aria-live sits here, not on the polled lists, which re-render wholesale every poll. -->
    <span class="pill" id="status-chip" role="status" aria-live="polite">
      <span class="pill-dot"></span><span>connecting</span>
    </span>
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch theme">
      <svg class="theme-icon ti-system" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22c5.52 0 10-4.48 10-10S17.52 2 12 2 2 6.48 2 12s4.48 10 10 10zm1-17.93c3.94.49 7 3.85 7 7.93s-3.06 7.44-7 7.93V4.07z"/></svg>
      <svg class="theme-icon ti-light" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM2 13h2a1 1 0 0 0 0-2H2a1 1 0 0 0 0 2zm18 0h2a1 1 0 0 0 0-2h-2a1 1 0 0 0 0 2zM11 2v2a1 1 0 0 0 2 0V2a1 1 0 0 0-2 0zm0 18v2a1 1 0 0 0 2 0v-2a1 1 0 0 0-2 0zM5.99 4.58a1 1 0 0 0-1.41 1.41l1.06 1.06a1 1 0 0 0 1.41-1.41L5.99 4.58zm12.37 12.37a1 1 0 0 0-1.41 1.41l1.06 1.06a1 1 0 0 0 1.41-1.41l-1.06-1.06zm1.06-10.96a1 1 0 0 0-1.41-1.41l-1.06 1.06a1 1 0 0 0 1.41 1.41l1.06-1.06zM7.05 18.36a1 1 0 0 0-1.41-1.41l-1.06 1.06a1 1 0 0 0 1.41 1.41l1.06-1.06z"/></svg>
      <svg class="theme-icon ti-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
    </button>
  </div>
</header>

<div class="shell">
  <nav class="sidebar" aria-label="Sections">
    <div class="nav-group">
      <div class="nav-title">Views</div>
      <button class="nav-link" type="button" id="v-attention" data-view="attention">
        <span data-icon="dashboard"></span><span class="nav-label">Needs attention</span>
      </button>
      <button class="nav-link" type="button" id="v-category" data-view="category">
        <span data-icon="category"></span><span class="nav-label">By category</span>
      </button>
    </div>

    <div class="nav-group">
      <div class="nav-title">Repository</div>
      <div class="repo-switch">
        <select class="select" id="f-repo" aria-label="repository" title="show only one scanned repository">
          <option value="">all repos</option>
        </select>
      </div>
      <!-- app.js fills the kind picker and links from CATS; below 900px the picker replaces the links. -->
      <div class="kind-switch">
        <select class="select" id="f-cat" aria-label="reference kind"></select>
      </div>
      <div class="nav-subtitle">Reference kind</div>
      <button class="nav-link" type="button" data-cat="">
        <span data-icon="inventory"></span>All references<span class="nav-count" id="c-all"></span>
      </button>
      <div class="nav-kinds" id="kind-links"></div>
    </div>

    <div class="nav-group nav-bottom">
      <a class="nav-link" href="/metrics"><span data-icon="timeline"></span>Metrics</a>
    </div>
  </nav>

  <main class="content">
    <div class="page-head">
      <h1>Dependency updates</h1>
      <div class="resource-meta">
        <span id="meta-scope">all repositories</span>
        <span class="meta-item"><span data-icon="schedule"></span>last scan <b id="last-scan-text">never</b></span>
      </div>
      <button class="btn filled" id="scan-btn" type="button" title="trigger a scan now (keyboard: r)">
        <span data-icon="refresh"></span><span>Scan now</span><kbd>r</kbd>
      </button>
    </div>

    <!-- Present from page load: an aria-live announcement only fires for a region that already exists. -->
    <div class="banner" id="scan-error" role="status" aria-live="polite" hidden>
      <span data-icon="error"></span><span id="scan-error-text"></span>
    </div>


    <div class="filters">
      <label class="field">
        <span data-icon="search"></span>
        <input id="q" type="text" placeholder="filter by name, workload or file (/)" autocomplete="off" spellcheck="false">
      </label>
      <select class="select" id="f-scope" aria-label="update scope">
        <option value="">any scope</option>
        <option value="major">major</option>
        <option value="minor">minor</option>
        <option value="patch">patch</option>
        <option value="unknown">unknown</option>
      </select>
      <span class="filter-count" id="shown-count" aria-live="polite"></span>
    </div>

    <!-- Material filter chips: each count is a filter, and a chip with nothing to show hides. -->
    <div class="chips" id="stats" role="group" aria-label="filter by state">
      <button class="chip is-update" type="button" data-tile="updates" aria-pressed="false" title="checks with a newer version">
        <span class="chip-icon" data-icon="update"></span><span class="chip-check" data-icon="check"></span>Updates<span class="chip-count" id="s-updates">0</span>
      </button>
      <button class="chip is-major" type="button" data-tile="major" aria-pressed="false" title="major version updates">
        <span class="chip-icon" data-icon="arrow_upward"></span><span class="chip-check" data-icon="check"></span>Major<span class="chip-count" id="s-major">0</span>
      </button>
      <button class="chip is-error" type="button" data-tile="errors" aria-pressed="false" title="lookups that failed">
        <span class="chip-icon" data-icon="error"></span><span class="chip-check" data-icon="check"></span>Errors<span class="chip-count" id="s-errors">0</span>
      </button>
      <button class="chip is-drift" type="button" data-tile="drift" aria-pressed="false" title="digest moved since the previous scan">
        <span class="chip-icon" data-icon="compare_arrows"></span><span class="chip-check" data-icon="check"></span>Drift<span class="chip-count" id="s-drift">0</span>
      </button>
      <button class="chip is-skipped" type="button" data-tile="skipped" aria-pressed="false" title="stray tags rejected by verification">
        <span class="chip-icon" data-icon="block"></span><span class="chip-check" data-icon="check"></span>Skipped<span class="chip-count" id="s-skipped">0</span>
      </button>
      <button class="chip is-ok" type="button" data-tile="current" aria-pressed="false" title="nothing to do">
        <span class="chip-icon" data-icon="done_all"></span><span class="chip-check" data-icon="check"></span>Current<span class="chip-count" id="s-current">0</span>
      </button>
    </div>

    <div id="tables"></div>

  </main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

</body>
</html>
