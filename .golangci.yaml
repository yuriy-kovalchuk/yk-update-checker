version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - exhaustive
    - noctx
    - bodyclose
    - unparam
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    revive:
      rules:
        - name: exported
          severity: warning
        - name: var-naming
          severity: warning
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - unparam
          - exhaustive

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/yuriy-kovalchuk
